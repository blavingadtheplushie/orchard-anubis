# Lets Orchard's server (and only it) manage the overlay IngressRoutes in kube-system.
# The graft itself only ever deletes routes labelled orchard-anubis/managed=true.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: orchard-anubis, namespace: kube-system}
rules:
- apiGroups: [traefik.io]
  resources: [ingressroutes]
  verbs: [get, list, watch, create, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: orchard-anubis, namespace: kube-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: orchard-anubis}
subjects:
- {kind: ServiceAccount, name: orchard-server, namespace: orchard}
